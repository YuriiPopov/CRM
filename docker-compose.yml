version: '3.8'

networks:
  b4u-network:
    driver: bridge

volumes:
  b4u_postgres_data:
  elasticsearch-data:
  grafana-data:
  prometheus-data:
  b4u-logs:

services:
  # ── Backend ─────────────────────────────────────
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://b4u:b4u_dev_password@postgres:5432/b4u_crm
      PORT: 3000
      # Берутся из окружения хоста или корневого .env рядом с этим файлом. Без непустого
      # JWT_SECRET (не дефолтного) backend в production не стартует — см.
      # backend/src/common/config/assert-production-config.ts. Через ${VAR:?} не делаем: compose
      # проверяет подстановки во всём файле, и падал бы даже `docker compose up -d postgres`.
      JWT_SECRET: ${JWT_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SALON_TIMEZONE: ${SALON_TIMEZONE:-Europe/Warsaw}
    volumes:
      - b4u-logs:/var/log/b4u-crm
    networks:
      - b4u-network
    depends_on:
      - postgres
    restart: unless-stopped

  # ── Database ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: b4u
      POSTGRES_PASSWORD: b4u_dev_password
      POSTGRES_DB: b4u_crm
    ports:
      - '5432:5432'
    volumes:
      - b4u_postgres_data:/var/lib/postgresql/data
    networks:
      - b4u-network

  # ── ELK Stack ────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - '9200:9200'
    networks:
      - b4u-network
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    volumes:
      - ./infra/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./infra/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    ports:
      - '5044:5044'
    environment:
      LS_JAVA_OPTS: '-Xmx256m -Xms256m'
    depends_on:
      - elasticsearch
    networks:
      - b4u-network
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    ports:
      - '5601:5601'
    environment:
      ELASTICSEARCH_HOSTS: 'http://elasticsearch:9200'
    depends_on:
      - elasticsearch
    networks:
      - b4u-network
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    user: root
    volumes:
      - ./infra/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - b4u-logs:/var/log/b4u-crm:ro
    depends_on:
      - logstash
    networks:
      - b4u-network
    restart: unless-stopped

  # ── Prometheus + Grafana ─────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '9090:9090'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - b4u-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: b4u_grafana_2024
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - b4u-network
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.7.0
    ports:
      - '9100:9100'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - b4u-network
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: 'postgresql://b4u:b4u_dev_password@postgres:5432/b4u_crm?sslmode=disable'
    ports:
      - '9187:9187'
    depends_on:
      - postgres
    networks:
      - b4u-network
    restart: unless-stopped
