input {
  beats {
    port => 5044
  }
}

filter {
  if [message] =~ /^\{/ {
    json {
      source => "message"
    }
  }

  mutate {
    add_field => { "app" => "b4u-crm" }
  }

  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
    remove_field => ["timestamp"]
  }

  if [level] {
    mutate { uppercase => ["level"] }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "b4u-crm-logs-%{+YYYY.MM.dd}"
  }
}
